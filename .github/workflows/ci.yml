name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Floor and latest stable. 3.9 is what macOS ships as /usr/bin/python3,
        # so a user with no package manager still works; 3.14 proves the tool
        # is not stuck on an old runtime.
        python-version: ["3.9", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -V
      - run: python3 -m py_compile scripts/agent_token_saver.py
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n install.sh

  neutral-ggcoder:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Fresh HOME install and zero-skill gate
        run: |
          export HOME="$(mktemp -d)"
          bash install.sh ggcoder
          test -x "$HOME/.local/bin/agent-skill-route"
          test -f "$HOME/.gg/skills/agent-token-saver-skill-router.md"
          "$HOME/.local/bin/agent-skill-route" \
            route "What is 2 plus 2?" --strict --json > result.json
          python3 -c 'import json; assert json.load(open("result.json"))["selected"] == []'

  # The README's `curl | bash` path clones instead of using a checkout, so it is
  # a separate code path and needs its own coverage.
  piped-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          path: source
      - name: Install the way a new user does
        run: |
          export HOME="$(mktemp -d)"
          cd "$(mktemp -d)"
          ATSR_REPO_URL="$GITHUB_WORKSPACE/source" \
            bash "$GITHUB_WORKSPACE/source/install.sh" ggcoder
          test -x "$HOME/.local/bin/agent-skill-route"
          "$HOME/.local/bin/agent-skill-route" route "ship a landing page" --json >/dev/null
